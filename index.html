<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pending &amp; Allotment — POGO</title>

<style>
:root{
  --paper:#F2F4F3; --card:#FFFFFF; --ink:#16202A; --ink-2:#5A6B78;
  --rule:#D3DAD9; --rule-2:#E8ECEB; --sub:#F6F8F7;
  --good:#0F6E5C; --good-bg:#E4F0EC;
  --short:#A8401F; --short-bg:#F7E9E3;
  --w:#2D4A7C; --w-bg:#E5EAF3;
  --amber:#8A6100; --amber-bg:#F6EEDC;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}

header.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header.top h1{font-size:22px;font-weight:640;letter-spacing:-.01em;margin:0}
header.top .ver{color:var(--ink-2);font-size:12px}
.sub-t{color:var(--ink-2);font-size:13.5px;margin:4px 0 18px;max-width:64ch}

.intake{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.intake.three{grid-template-columns:1fr 1fr}
@media(max-width:900px){.intake.three{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.intake,.intake.three{grid-template-columns:1fr}}
.drop{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:14px 15px;cursor:pointer;display:block;position:relative}
.drop:hover{border-color:var(--ink-2)}
.drop.on{border-color:var(--good);background:var(--good-bg)}
.drop .lab{font-weight:600;font-size:14px}
.drop .hint{color:var(--ink-2);font-size:12.5px;margin-top:3px;display:block;word-break:break-word}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
#stamp{display:block;color:var(--ink-2);font-size:12px;margin-top:8px}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
button{font:inherit;font-size:14px;background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--ink-2)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--w);outline-offset:1px}
select,input[type=text]{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink)}
label.inline{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
#partyCount{color:var(--ink-2);font-size:12.5px}
#partyWrap,#sourceWrap{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:14px 16px;margin:4px 0 6px}

nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-top:16px;overflow-x:auto}
nav.tabs button{border:none;border-bottom:2px solid transparent;background:none;border-radius:0;padding:9px 13px;color:var(--ink-2);white-space:nowrap;font-size:14px}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
section.panel{display:none;padding-top:18px}
section.panel.show{display:block}

.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;background:var(--card);
  touch-action:pan-x;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;contain:content}
.tw.vscroll{touch-action:auto;overscroll-behavior:contain}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 11px;text-align:left;border-bottom:1px solid var(--rule-2);white-space:nowrap}
th{background:var(--card);font-weight:600;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--rule)}
@media(hover:hover) and (min-width:820px){th{position:sticky;top:0;z-index:1}}
td.n,th.n{text-align:right}
tbody tr:last-child td{border-bottom:none}
tr.clik{cursor:pointer}
@media(hover:hover){tr.clik:hover{background:#FAFBFB}}
td.tw-x{width:22px;color:var(--ink-2);font-weight:600}
tr.grp td{background:#EDF0EF;font-weight:600;font-size:12.5px}
tr.sub-h td{background:var(--sub);font-size:11.5px;color:var(--ink-2);font-weight:600}
tr.sub td{background:var(--sub);cursor:pointer}
@media(hover:hover){tr.sub:hover td{background:#EFF3F1}}
tr.detail td{background:var(--sub);font-size:12.5px;color:var(--ink-2);white-space:normal}
.dk{color:var(--ink);font-weight:600;margin-left:10px}
tr.detail td .dk:first-child{margin-left:0}

.tag{display:inline-block;padding:1px 6px;border-radius:2px;font-size:11.5px;font-weight:600;line-height:1.5}
.t-W1,.t-W2{background:var(--w-bg);color:var(--w)}
.t-R1,.t-R2{background:var(--good-bg);color:var(--good)}
.t-R3{background:var(--rule-2);color:var(--ink-2)}
.full{color:var(--good);font-weight:600}
.none{color:var(--ink-2)}
.bal{color:var(--short);font-weight:600}
.ready{color:var(--good);font-weight:600}
.pend{color:var(--ink-2);font-style:italic}

.note{background:var(--amber-bg);border:1px solid #E4D3A8;border-radius:3px;padding:11px 13px;font-size:13.5px;margin:14px 0}
.note.bad{background:var(--short-bg);border-color:#E8C4B4}
.more{display:block;width:100%;margin:10px 0 0;padding:10px;text-align:center}
.empty{color:var(--ink-2);padding:34px 16px;text-align:center;font-size:14px;background:var(--card);border:1px solid var(--rule);border-radius:3px}
h2.sec{font-size:16px;font-weight:640;margin:0 0 8px}
p.exp{color:var(--ink-2);font-size:13px;margin:0 0 12px;max-width:74ch}
.fld{display:block;margin:10px 0}
.fld span{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
.fld input{width:100%}
.hintline{font-size:12.5px;color:var(--ink-2)}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--rule-2);color:var(--ink-2)}
.chip.live{background:var(--good-bg);color:var(--good)}
.chip.wait{background:var(--amber-bg);color:var(--amber)}
.chip.err{background:var(--short-bg);color:var(--short)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>Pending &amp; Allotment</h1>
  <span class="ver">v3.1</span>
  <span class="chip" id="chip" title="Set Tracker connection">local</span>
</header>
<p class="sub-t">Your two pending reports, with stock already allotted against them.</p>

<div class="intake three">
  <label class="drop" id="dropOrders">
    <span class="lab">Pending order file</span>
    <span class="hint" id="hOrders">Design Wise Order Report — tap to choose</span>
    <input type="file" id="fOrders" accept=".xlsx,.xls">
  </label>
  <label class="drop" id="dropStock">
    <span class="lab">Stock file</span>
    <span class="hint" id="hStock">Design Wise Stock Overall Detail — tap to choose</span>
    <input type="file" id="fStock" accept=".xlsx,.xls">
  </label>
  <label class="drop" id="dropPurch">
    <span class="lab">Purchase inward</span>
    <span class="hint" id="hPurch">Purchase export — tells the app what is cut but unfinished</span>
    <input type="file" id="fPurch" accept=".xlsx,.xls">
  </label>
  <label class="drop" id="dropTrack">
    <span class="lab">Set Tracker board</span>
    <span class="hint" id="hTrack">Reads the live board — or tap for an Export JSON</span>
    <input type="file" id="fTrack" accept=".json">
  </label>
</div>
<span id="stamp"></span>

<div class="bar">
  <label class="inline">Allot as
    <select id="mode"><option value="sets" selected>whole sets</option><option value="pieces">loose pieces</option></select>
  </label>
  <label class="inline">Unassigned parties
    <select id="defCat"><option value="R3">R3</option><option value="R2">R2</option><option value="R1">R1</option></select>
  </label>
  <button id="togSources" aria-expanded="false">Sheet links</button>
  <button id="refresh">Refresh from sheet</button>
  <button id="togParties" aria-expanded="false">Party categories</button>
  <span id="partyCount"></span>
  <button id="exportBtn" disabled>Export to Excel</button>
  <button id="clear">Clear files</button>
  <input type="file" id="fCats" accept=".json" class="sr">
</div>

<div id="sourceWrap" hidden><div id="sources"></div></div>
<div id="partyWrap" hidden><div id="parties"></div></div>
<div id="msg"></div>

<nav class="tabs" role="tablist">
  <button role="tab" data-p="cust" aria-selected="true">Customer wise pending</button>
  <button role="tab" data-p="design" aria-selected="false">Design wise pending</button>
</nav>

<section class="panel show" id="p-cust"><div class="empty">Load the pending order file to see this report.</div></section>
<section class="panel" id="p-design"><div class="empty">Load the pending order file to see this report.</div></section>

</div>
<script>
/* Allocation core — shared by the app and the Node test harness.
   Everything here is pure: no DOM, no globals. */

const CHAIN = ['W1', 'W2', 'R1', 'R2', 'R3'];
const WHOLESALE = ['W1', 'W2'];
const RETAIL = ['R1', 'R2'];

/* ---------- size handling ---------- */

// "0-8" -> [0..8]; "4" -> [4]; "Default"/"Mix"/"" -> null (unallocatable)
function expandSize(raw) {
  const s = String(raw == null ? '' : raw).trim();
  if (!s) return null;
  const m = s.match(/^(\d+)\s*[-–]\s*(\d+)$/);
  if (m) {
    let a = +m[1], b = +m[2];
    if (a > b) [a, b] = [b, a];
    if (b - a > 30) return null;
    const out = [];
    for (let i = a; i <= b; i++) out.push(i);
    return out;
  }
  if (/^\d+$/.test(s)) return [+s];
  return null;
}

function rangeLabel(sizes) {
  if (sizes.length === 1) return String(sizes[0]);
  return sizes[0] + '-' + sizes[sizes.length - 1];
}

// Group a {size: qty} map into contiguous runs that share the same per-size qty.
function toRanges(perSize) {
  const sizes = Object.keys(perSize).map(Number).filter(s => perSize[s] > 0).sort((a, b) => a - b);
  const out = [];
  let run = null;
  for (const s of sizes) {
    const q = perSize[s];
    if (run && s === run.last + 1 && q === run.qty) { run.last = s; run.sizes.push(s); }
    else { if (run) out.push(run); run = { first: s, last: s, qty: q, sizes: [s] }; }
  }
  if (run) out.push(run);
  return out.map(r => ({ size: rangeLabel(r.sizes), perSize: r.qty, pieces: r.qty * r.sizes.length }));
}

/* ---------- normalisation ---------- */

const stripDes = d => String(d || '').trim().replace(/^DES[-\s]*/i, '');
const normColor = (c, aliases) => {
  const k = String(c || '').trim().toLowerCase().replace(/\s+/g, ' ');
  return (aliases && aliases[k]) ? aliases[k] : k;
};
const normCust = n => String(n || '').trim().replace(/\s+/g, ' ');
const custKey = n => normCust(n).toLowerCase();

/* Spread a quantity evenly across sizes. Remainder lands on the smallest sizes
   (negatives: remainder lands on the smallest sizes too, so signs stay consistent). */
function spread(qty, sizes) {
  const n = sizes.length;
  const sign = qty < 0 ? -1 : 1;
  const abs = Math.abs(qty);
  const base = Math.floor(abs / n);
  let rem = abs - base * n;
  const out = {};
  for (const s of sizes) {
    let v = base;
    if (rem > 0) { v += 1; rem -= 1; }
    out[s] = sign * v;
  }
  return out;
}

/* ---------- stock netting ---------- */
/* Returns Map "design|color" -> { perSize:{size:qty}, skipped:[rows] } */
function netStock(stockRows, opts = {}) {
  const aliases = opts.aliases || {};
  const col = opts.stockColumn || 'Current Stock';
  const map = new Map();
  const skipped = [];
  for (const r of stockRows) {
    const design = stripDes(r['Design Name']);
    const color = normColor(r['Color Name'], aliases);
    const qty = Number(r[col] || 0);
    if (!design || !color || color === 'no color' || !qty) continue;
    const sizes = expandSize(r['Size']);
    if (!sizes) { skipped.push({ design, color, size: r['Size'], qty }); continue; }
    const key = design + '|' + color;
    if (!map.has(key)) map.set(key, {});
    const bucket = map.get(key);
    const parts = spread(qty, sizes);
    for (const s of sizes) bucket[s] = (bucket[s] || 0) + parts[s];
  }
  // clamp negatives away after netting
  for (const [, bucket] of map) for (const s of Object.keys(bucket)) if (bucket[s] < 0) bucket[s] = 0;
  return { stock: map, skipped };
}

/* ---------- demand ---------- */
/* Returns array of line objects with per-size demand. */
function buildDemandCore(orderRows, opts = {}) {
  const aliases = opts.aliases || {};
  const lines = [];
  const skipped = [];
  orderRows.forEach((r, i) => {
    const qty = Number(r['Pending Qty.'] || 0);
    if (!(qty > 0)) return;
    const design = stripDes(r['Design Name']);
    const color = normColor(r['Color'], aliases);
    const sizes = expandSize(r['Size']);
    if (!sizes || !design) { skipped.push({ row: i + 2, design, color, size: r['Size'], qty }); return; }
    lines.push({
      id: i,
      order: r['Order Number'] || '',
      date: parseDate(r['Order Date']),
      dateRaw: r['Order Date'] || '',
      expected: r['Expected Date'] || '',
      customer: normCust(r['Customer Name']),
      ckey: custKey(r['Customer Name']),
      design, color,
      sizeLabel: String(r['Size'] || '').trim(),
      sizes,
      qty,
      perSize: spread(qty, sizes),
      agent: r['Agent Name'] || '',
      tag: r['Tag'] || '',
    });
  });
  return { lines, skipped };
}

function parseDate(s) {
  if (!s) return 0;
  const m = String(s).match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
  if (m) {
    const mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[2].toLowerCase());
    if (mo >= 0) return Date.UTC(+m[3], mo, +m[1]);
  }
  const d = Date.parse(s);
  return isNaN(d) ? 0 : d;
}

/* ---------- the waterfall ---------- */
/*
  Per design + colour + individual size:
    retailReserve = min(retail demand, ceil(0.25 * A))       retail floor
    wholesaleAvail = min(A - retailReserve, floor(0.75 * A))  wholesale ceiling
    W1 then W2 draw from wholesaleAvail
    remaining splits 50/50 between R1 and R2 (each capped by its own demand)
    leftovers cascade W1 -> W2 -> R1 -> R2 -> R3
  Within a tier, customers are served by the tie-break rule (fifo | prorata).
*/
function allocate(lines, stockMap, opts = {}) {
  const catOf = opts.categories || {};        // ckey -> 'W1'|'W2'|'R1'|'R2'|'R3'
  const defaultCat = opts.defaultCategory || 'R2';
  const tieBreak = opts.tieBreak || 'fifo';
  const wholesaleCapPct = opts.wholesaleCapPct != null ? opts.wholesaleCapPct : 0.75;
  const retailFloorPct = opts.retailFloorPct != null ? opts.retailFloorPct : 0.25;

  // index demand by design|color|size
  const cells = new Map();
  for (const ln of lines) {
    for (const s of ln.sizes) {
      const key = ln.design + '|' + ln.color + '|' + s;
      if (!cells.has(key)) cells.set(key, []);
      cells.get(key).push({ line: ln, want: ln.perSize[s], got: 0 });
    }
  }

  const alloc = new Map();  // lineId -> {size: qty}
  const give = (claim, n, size) => {
    if (n <= 0) return 0;
    const take = Math.min(n, claim.want - claim.got);
    if (take <= 0) return 0;
    claim.got += take;
    if (!alloc.has(claim.line.id)) alloc.set(claim.line.id, {});
    const a = alloc.get(claim.line.id);
    a[size] = (a[size] || 0) + take;
    return take;
  };

  const stats = { cells: 0, allocated: 0, available: 0, demanded: 0, swept: 0, capped: 0 };

  // Process cells grouped by design+colour so the R1/R2 rounding remainder can be
  // carried across that group's sizes. Without this, a cell holding 1 piece always
  // rounds R1's half down to 0 and R2 silently wins every size.
  const carry = new Map();
  const orderedKeys = [...cells.keys()].sort();

  for (const key of orderedKeys) {
    const claims = cells.get(key);
    const [design, color, sizeStr] = key.split('|');
    const size = Number(sizeStr);
    const bucket = stockMap.get(design + '|' + color);
    let A = bucket ? (bucket[size] || 0) : 0;
    const totalWant = claims.reduce((t, c) => t + c.want, 0);
    stats.cells++; stats.available += A; stats.demanded += totalWant;
    if (A <= 0) continue;

    const byCat = {};
    for (const c of CHAIN) byCat[c] = [];
    for (const c of claims) {
      const cat = catOf[c.line.ckey] || defaultCat;
      (byCat[cat] || byCat[defaultCat]).push(c);
    }
    for (const c of CHAIN) byCat[c] = orderClaims(byCat[c], tieBreak);

    const wantOf = cat => byCat[cat].reduce((t, c) => t + (c.want - c.got), 0);
    const retailWant = wantOf('R1') + wantOf('R2');

    const retailReserve = Math.min(retailWant, Math.ceil(retailFloorPct * A));
    const wholesaleAvail = Math.min(A - retailReserve, Math.floor(wholesaleCapPct * A));

    let pool = wholesaleAvail;
    for (const cat of WHOLESALE) pool -= serve(byCat[cat], pool, size, give, tieBreak);
    const usedWholesale = wholesaleAvail - pool;

    let retailPool = A - usedWholesale;
    const gkey = design + '|' + color;
    const exact = retailPool / 2 + (carry.get(gkey) || 0);
    const r1Share = Math.min(retailPool, Math.floor(exact));
    carry.set(gkey, exact - r1Share);
    const shares = { R1: r1Share, R2: retailPool - r1Share };
    let used = 0;
    for (const cat of RETAIL) used += serve(byCat[cat], shares[cat], size, give, tieBreak);

    // cascade leftovers down the chain, then to R3
    let left = A - usedWholesale - used;
    for (const cat of CHAIN) {
      if (left <= 0) break;
      left -= serve(byCat[cat], left, size, give, tieBreak);
    }
    // final sweep back up the chain so nothing sits idle while demand exists
    if (left > 0) {
      for (const cat of CHAIN) {
        if (left <= 0) break;
        const before = left;
        left -= serve(byCat[cat], left, size, give, tieBreak);
        stats.swept += before - left;
      }
    }
    stats.allocated += A - left;
  }

  return { alloc, stats };
}

function orderClaims(list, tieBreak) {
  if (tieBreak === 'prorata') return list.slice();
  return list.slice().sort((a, b) => (a.line.date - b.line.date) || (a.line.id - b.line.id));
}

// Hand out `budget` pieces to a tier's claims. Returns how many were used.
function serve(claims, budget, size, give, tieBreak) {
  if (budget <= 0 || !claims.length) return 0;
  let used = 0;
  if (tieBreak === 'prorata') {
    const open = claims.filter(c => c.want > c.got);
    const total = open.reduce((t, c) => t + (c.want - c.got), 0);
    if (!total) return 0;
    if (budget >= total) { for (const c of open) used += give(c, c.want - c.got, size); return used; }
    // largest-remainder apportionment
    const raw = open.map(c => ((c.want - c.got) * budget) / total);
    const floors = raw.map(Math.floor);
    let rem = budget - floors.reduce((a, b) => a + b, 0);
    const order = raw.map((v, i) => [v - floors[i], i]).sort((a, b) => b[0] - a[0]);
    for (let k = 0; k < rem; k++) floors[order[k % order.length][1]]++;
    open.forEach((c, i) => { used += give(c, floors[i], size); });
    return used;
  }
  for (const c of claims) {
    if (used >= budget) break;
    used += give(c, budget - used, size);
  }
  return used;
}

/* ---------- full-set-only customers ---------- */
/* Release allocations for customers who won't accept partials unless the line is fully covered. */
function enforceFullOnly(lines, alloc, fullOnly) {
  const released = [];
  for (const ln of lines) {
    if (!fullOnly[ln.ckey]) continue;
    const a = alloc.get(ln.id);
    if (!a) continue;
    const got = Object.values(a).reduce((t, v) => t + v, 0);
    if (got < ln.qty) { alloc.delete(ln.id); released.push({ line: ln, got }); }
  }
  return released;
}

/* ---------- report builders ---------- */

function designWiseReport(lines) {
  const map = new Map();
  for (const ln of lines) {
    const key = ln.design + '|' + ln.color + '|' + ln.sizeLabel;
    if (!map.has(key)) map.set(key, { design: ln.design, color: ln.color, size: ln.sizeLabel, qty: 0 });
    map.get(key).qty += ln.qty;
  }
  return [...map.values()].sort(cmpDCS);
}

function customerWiseReport(lines) {
  const map = new Map();
  for (const ln of lines) {
    const key = ln.ckey + '|' + ln.design + '|' + ln.color + '|' + ln.sizeLabel;
    if (!map.has(key)) map.set(key, { customer: ln.customer, design: ln.design, color: ln.color, size: ln.sizeLabel, qty: 0 });
    map.get(key).qty += ln.qty;
  }
  return [...map.values()].sort((a, b) => a.customer.localeCompare(b.customer) || cmpDCS(a, b));
}

function cmpDCS(a, b) {
  return a.design.localeCompare(b.design, undefined, { numeric: true })
    || a.color.localeCompare(b.color)
    || String(a.size).localeCompare(String(b.size), undefined, { numeric: true });
}

/* Per-line allocation result rolled back up into size ranges. */
function allocationRows(lines, alloc, catOf, defaultCat) {
  const rows = [];
  for (const ln of lines) {
    const a = alloc.get(ln.id) || {};
    const got = Object.values(a).reduce((t, v) => t + v, 0);
    rows.push({
      customer: ln.customer,
      category: catOf[ln.ckey] || defaultCat,
      design: ln.design,
      color: ln.color,
      size: ln.sizeLabel,
      order: ln.order,
      date: ln.dateRaw,
      ordered: ln.qty,
      allocated: got,
      balance: ln.qty - got,
      ranges: toRanges(a),
      lineId: ln.id,
    });
  }
  return rows;
}

const CORE = {
  CHAIN, expandSize, toRanges, stripDes, normColor, normCust, custKey, spread,
  netStock, buildDemandCore, allocate, enforceFullOnly,
  designWiseReport, customerWiseReport, allocationRows, parseDate,
};


/* Set-preserving allocation.
   A claim is served only in whole blocks: one block = one full traverse of the
   order's own size range at its per-size rate. An order for 0-10 qty 22 is two
   blocks of 11. Nothing gets a broken set. */


function allocateSets(lines, stockMap, opts = {}) {
  const catOf = opts.categories || {};
  const defaultCat = opts.defaultCategory || 'R2';
  const wholesaleCapPct = opts.wholesaleCapPct != null ? opts.wholesaleCapPct : 0.75;
  const retailFloorPct = opts.retailFloorPct != null ? opts.retailFloorPct : 0.25;

  const groups = new Map();
  for (const ln of lines) {
    const k = ln.design + '|' + ln.color;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(ln);
  }

  const alloc = new Map();
  const stats = { groups: 0, allocated: 0, available: 0, demanded: 0, blockedByShape: 0 };
  const carry = new Map();

  for (const [gkey, glines] of groups) {
    const bucket = stockMap.get(gkey);
    const avail = {};
    let A = 0;
    if (bucket) for (const s of Object.keys(bucket)) { avail[s] = bucket[s]; A += bucket[s]; }
    const demanded = glines.reduce((t, l) => t + l.qty, 0);
    stats.groups++; stats.available += A; stats.demanded += demanded;
    if (A <= 0) continue;

    const claims = glines.map(ln => ({
      line: ln,
      per: ln.perSize,
      blockCost: ln.sizes.reduce((t, s) => t + ln.perSize[s], 0),
      blocksWanted: Math.max(1, Math.round(ln.qty / ln.sizes.reduce((t, s) => t + ln.perSize[s], 0))),
      blocksGot: 0,
      cat: catOf[ln.ckey] || defaultCat,
    }));

    const byCat = {};
    for (const c of CHAIN) byCat[c] = [];
    for (const c of claims) (byCat[c.cat] || byCat[defaultCat]).push(c);
    for (const c of CHAIN) byCat[c].sort((a, b) => (a.line.date - b.line.date) || (a.line.id - b.line.id));

    const openPieces = cat => byCat[cat].reduce((t, c) => t + (c.blocksWanted - c.blocksGot) * c.blockCost, 0);

    const canTake = c => c.line.sizes.every(s => (avail[s] || 0) >= c.per[s]);
    const take = c => {
      for (const s of c.line.sizes) avail[s] -= c.per[s];
      c.blocksGot++;
      const a = alloc.get(c.line.id) || {};
      for (const s of c.line.sizes) a[s] = (a[s] || 0) + c.per[s];
      alloc.set(c.line.id, a);
      return c.blockCost;
    };

    // Serve a tier from a piece budget, in whole blocks only.
    const serve = (cat, budget) => {
      let used = 0;
      let progress = true;
      while (progress && used < budget) {
        progress = false;
        for (const c of byCat[cat]) {
          if (c.blocksGot >= c.blocksWanted) continue;
          if (used + c.blockCost > budget) continue;
          if (!canTake(c)) continue;
          used += take(c);
          progress = true;
        }
      }
      return used;
    };

    // Percentage caps only make sense when there is enough stock for every tier
    // with demand to receive at least one whole block. Below that, splitting the
    // stock strands it — nobody's block fits — so priority order decides outright.
    let need = 0;
    for (const cat of CHAIN) {
      const open = byCat[cat].filter(c => c.blocksGot < c.blocksWanted);
      if (open.length) need += Math.min(...open.map(c => c.blockCost));
    }
    if (A < need) {
      let leftThin = A;
      for (const cat of CHAIN) {
        if (leftThin <= 0) break;
        leftThin -= serve(cat, leftThin);
      }
      stats.allocated += A - leftThin;
      stats.thinGroups = (stats.thinGroups || 0) + 1;
      if (leftThin > 0) stats.blockedByShape += leftThin;
      continue;
    }

    const retailWant = openPieces('R1') + openPieces('R2');
    const retailReserve = Math.min(retailWant, Math.ceil(retailFloorPct * A));
    const wholesaleAvail = Math.min(A - retailReserve, Math.floor(wholesaleCapPct * A));

    let usedW = 0;
    for (const cat of WHOLESALE) usedW += serve(cat, wholesaleAvail - usedW);

    const retailPool = A - usedW;
    const exact = retailPool / 2 + (carry.get(gkey) || 0);
    const r1Share = Math.min(retailPool, Math.floor(exact));
    carry.set(gkey, exact - r1Share);
    const shares = { R1: r1Share, R2: retailPool - r1Share };
    let usedR = 0;
    for (const cat of RETAIL) usedR += serve(cat, shares[cat]);

    // cascade, then sweep — nothing idle while a whole block still fits
    let left = A - usedW - usedR;
    for (let pass = 0; pass < 2 && left > 0; pass++) {
      for (const cat of CHAIN) {
        if (left <= 0) break;
        left -= serve(cat, left);
      }
    }
    stats.allocated += A - left;
    if (left > 0 && glines.some(l => (alloc.get(l.id) ? sum(alloc.get(l.id)) : 0) < l.qty)) {
      stats.blockedByShape += left;
    }
  }

  return { alloc, stats };
}

const sum = o => Object.values(o).reduce((a, b) => a + b, 0);


/* ----------------------------------------------------------------
   LOT LEDGER
   Purchase entries are made at cutting, so Current Stock counts
   fabric that isn't a sellable set yet. Any lot with open stages on
   the board is work in progress: its purchase quantity is subtracted
   from stock and re-published as an arrival on the board's date.
------------------------------------------------------------------ */

/* "1219 - 9 (Washing)" -> "1219-9"   "1306 (0-3)" -> "1306" */
function lotId(label) {
  return String(label || '').replace(/\(.*$/, '').trim().replace(/\s*-\s*/g, '-');
}

const Lots = {
  wip: null,        // "design|color" -> {size: pieces still being made}
  arrivals: null,   // "design|color|size" -> [{lot, pieces, due}]
  openLots: [],
  unmatched: [],

  build(purchaseRows, tracker, aliases) {
    this.wip = new Map();
    this.arrivals = new Map();
    this.openLots = [];
    this.unmatched = [];
    if (!purchaseRows || !tracker || !tracker.sets) return this;

    const parts = {};
    for (const c of (tracker.categories || [])) parts[c.id] = (c.parts || []).map(p => p.key);

    // one entry per lot, even if the board holds duplicate rows for it
    const open = new Map();
    for (const s of tracker.sets) {
      const req = parts[s.catId] || [];
      const done = new Set(s.done || []);
      const stillOpen = req.filter(k => !done.has(k));
      if (!stillOpen.length) continue;
      const id = lotId(s.pattern);
      if (!id) continue;
      const dates = stillOpen.map(k => (s.dates || {})[k]).filter(Boolean).sort();
      const due = dates.length ? dates[dates.length - 1] : null;
      const prev = open.get(id);
      // keep the earliest known due date when a lot appears twice
      if (!prev || (due && (!prev.due || due < prev.due))) open.set(id, { id, due, label: s.pattern });
    }

    // index purchase rows by lot
    const byLot = new Map();
    for (const r of purchaseRows) {
      const id = lotId(r['Challan No']);
      if (!id) continue;
      if (!byLot.has(id)) byLot.set(id, []);
      byLot.get(id).push(r);
    }

    for (const [id, info] of open) {
      const rows = byLot.get(id);
      if (!rows) { this.unmatched.push(info); continue; }
      let pieces = 0;
      for (const r of rows) {
        const design = stripDes(r['Design Name Without Prefix'] || r['Design Number']);
        const color = normColor(r['Color'], aliases);
        const qty = Number(r['Quantity'] || 0);
        const sizes = expandSize(r['Size']);
        if (!design || !color || !qty || !sizes) continue;
        const per = spread(qty, sizes);
        const gk = design + '|' + color;
        if (!this.wip.has(gk)) this.wip.set(gk, {});
        const bucket = this.wip.get(gk);
        for (const s of sizes) {
          bucket[s] = (bucket[s] || 0) + per[s];
          const ak = gk + '|' + s;
          if (!this.arrivals.has(ak)) this.arrivals.set(ak, new Map());
          const byLotHere = this.arrivals.get(ak);
          // one purchase lot can cover a size through several overlapping ranges
          const cur = byLotHere.get(id) || { lot: info.label, pieces: 0, due: info.due };
          cur.pieces += per[s];
          byLotHere.set(id, cur);
        }
        pieces += qty;
      }
      this.openLots.push({ id, label: info.label, due: info.due, pieces });
    }

    for (const [k, m] of this.arrivals) {
      this.arrivals.set(k, [...m.values()].sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999')));
    }
    this.openLots.sort((a, b) => b.pieces - a.pieces);
    return this;
  },

  /* netted stock minus work in progress */
  freeStock(stockMap) {
    if (!this.wip || !this.wip.size) return { free: stockMap, held: 0 };
    const free = new Map();
    let held = 0;
    for (const [k, bucket] of stockMap) {
      const w = this.wip.get(k) || {};
      const out = {};
      for (const s of Object.keys(bucket)) {
        const take = Math.min(bucket[s], w[s] || 0);
        held += take;
        const left = bucket[s] - take;
        if (left > 0) out[s] = left;
      }
      if (Object.keys(out).length) free.set(k, out);
    }
    return { free, held };
  },

  /* what is coming for one design/colour/size, soonest first */
  arriving(design, color, size) {
    if (!this.arrivals) return [];
    return this.arrivals.get(design + '|' + color + '|' + size) || [];
  },
};

/* ----------------------------------------------------------------
   SHEET SOURCES — pull the two tables straight from Google Sheets.
   Accepts either a normal sheet URL (converted to the gviz CSV
   endpoint) or a File → Share → Publish to web CSV link. Read-only.
------------------------------------------------------------------ */
const Sheets = {
  normalize(u) {
    u = String(u || '').trim();
    if (!u) return '';
    if (u.includes('/pub')) return u.includes('output=csv') ? u : u + (u.includes('?') ? '&' : '?') + 'output=csv';
    const id = u.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    if (!id) return u;
    const gid = (u.match(/[#&?]gid=(\d+)/) || [])[1] || '0';
    return 'https://docs.google.com/spreadsheets/d/' + id[1] + '/gviz/tq?tqx=out:csv&gid=' + gid;
  },

  /* Deliberately not SheetJS: its CSV reader guesses types and turns
     size labels like 4-8 into dates. Everything here stays a string. */
  parseCsv(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const rows = [];
    let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (c !== '\r') cell += c;
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    if (!rows.length) return [];
    const head = rows[0].map(h => h.trim());
    return rows.slice(1)
      .filter(r => r.some(v => v !== ''))
      .map(r => { const o = {}; head.forEach((h, i) => { o[h] = (r[i] == null ? '' : r[i]).trim(); }); return o; });
  },

  async grab(url) {
    const r = await fetch(this.normalize(url), { credentials: 'omit' });
    if (!r.ok) throw new Error(r.status === 404 ? 'that tab was not found' : 'the sheet refused the request (' + r.status + ')');
    const text = await r.text();
    if (/^\s*</.test(text)) throw new Error('the sheet is not readable without signing in');
    return this.parseCsv(text);
  },

  async pull(which, quiet) {
    const url = S.src[which];
    if (!url) return false;
    try {
      const rows = await this.grab(url);
      const head = rows.length ? Object.keys(rows[0]) : [];
      if (head.some(h => /^SUM of /i.test(h))) {
        throw new Error('that is a pivot tab, not the raw data — point this at the Input Design Pending Orders tab instead');
      }
      if (which === 'orders') {
        const bad = missingCols(rows, ['Design Name', 'Customer Name', 'Color', 'Size', 'Pending Qty.'], 'pending order');
        if (bad) throw new Error(bad);
        S.orderRows = slim(rows, O_COLS);
        S.meta.orders = 'from sheet';
      } else if (which === 'stock') {
        const bad = missingCols(rows, ['Design Name', 'Color Name', 'Size', 'Current Stock'], 'stock');
        if (bad) throw new Error(bad);
        S.stockRows = slim(rows, S_COLS);
        S.meta.stock = 'from sheet';
      } else {
        const bad = missingCols(rows, ['Challan No', 'Color', 'Size', 'Quantity'], 'purchase');
        if (bad) throw new Error(bad);
        S.purchRows = slim(rows, P_COLS);
        S.meta.purchase = 'from sheet';
      }
      S.meta.when = new Date().toLocaleString();
      return true;
    } catch (e) {
      if (!quiet) msg('Could not read the ' + which + ' tab — ' + esc(e.message) + '. Check the link, or use File → Share → Publish to web → CSV in the sheet.', 'bad');
      return false;
    }
  },

  async pullAll(quiet) {
    if (!S.src.orders && !S.src.stock && !S.src.purchase) return;
    $('#refresh').textContent = 'Pulling…';
    const a = await this.pull('orders', quiet);
    const b = await this.pull('stock', quiet);
    const c = await this.pull('purchase', quiet);
    $('#refresh').textContent = 'Refresh from sheet';
    if (a || b || c) { S.open.clear(); S.openCust.clear(); save(); rebuild(); if (!quiet) msg(''); }
  },
};

/* ----------------------------------------------------------------
   SET TRACKER — reads the board's Export JSON.
   A set is ready when every part its category requires is either
   ticked off or has a date. The ready date is the latest of those
   dates, because the set can't go out until the slowest part lands.
   Where several lots share a pattern, the earliest one wins.
------------------------------------------------------------------ */
const SetTracker = {
  raw: null, index: null,

  load(json) {
    this.raw = json;
    const parts = {};
    for (const c of (json.categories || [])) {
      parts[c.id] = (c.parts || []).map(p => ({ key: p.key, label: p.label, optional: !!p.optional }));
    }
    const idx = new Map();
    for (const s of (json.sets || [])) {
      const label = String(s.pattern || '').trim();
      const m = label.match(/^\s*(\d+)/);
      if (!m) continue;
      const base = m.group ? m.group(1) : m[1];
      const sz = label.match(/\((\d+)\s*-\s*(\d+)\)/);
      const req = parts[s.catId] || [];
      const done = new Set(s.done || []);
      const dates = s.dates || {};
      const open = req.filter(p => !done.has(p.key));
      const missing = open.filter(p => !dates[p.key] && !p.optional).map(p => p.label);
      const known = open.map(p => dates[p.key]).filter(Boolean);
      const lot = {
        label, base,
        lo: sz ? +sz[1] : null, hi: sz ? +sz[2] : null,
        ready: open.length === 0 ? 'done' : (known.length ? known.sort().slice(-1)[0] : null),
        missing, priority: !!s.priority,
        openCount: open.length, totalParts: req.length,
      };
      if (!idx.has(base)) idx.set(base, []);
      idx.get(base).push(lot);
    }
    this.index = idx;
    return idx.size;
  },

  /* returns {state, date, label} — state is done | dated | undated | absent */
  lookup(design, sizeLabel) {
    if (!this.index) return { state: 'absent' };
    const lots = this.index.get(String(design));
    if (!lots || !lots.length) return { state: 'absent' };

    let pool = lots;
    const r = String(sizeLabel || '').match(/^(\d+)\s*-\s*(\d+)$/);
    if (r) {
      const lo = +r[1], hi = +r[2];
      const exact = lots.filter(l => l.lo === lo && l.hi === hi);
      const covers = lots.filter(l => l.lo !== null && l.lo <= lo && l.hi >= hi);
      const untagged = lots.filter(l => l.lo === null);
      pool = exact.length ? exact : (covers.length ? covers : (untagged.length ? untagged : lots));
    }
    if (pool.some(l => l.ready === 'done')) {
      return { state: 'done', label: pool.find(l => l.ready === 'done').label };
    }
    const dated = pool.filter(l => l.ready).sort((a, b) => a.ready.localeCompare(b.ready));
    if (dated.length) return { state: 'dated', date: dated[0].ready, label: dated[0].label };
    return { state: 'undated', label: pool[0].label, missing: pool[0].missing };
  },
};

const D_MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function shortDate(iso) {
  const p = String(iso).split('-');
  if (p.length !== 3) return iso;
  return +p[2] + ' ' + D_MON[+p[1] - 1];
}

function arrivalCell(design, color, sizeLabel) {
  const sizes = expandSize(sizeLabel);
  if (!sizes || !Lots.arrivals) return readyCell(design, sizeLabel);
  // an order spans a range; the line can only ship when its slowest size lands
  const perSize = sizes.map(s => Lots.arriving(design, color, s));
  if (perSize.some(l => !l.length)) return readyCell(design, sizeLabel);
  let due = null, lots = new Set();
  for (const list of perSize) {
    const first = list[0];
    lots.add(first.lot);
    if (!due || (first.due || '9999') > due) due = first.due || '9999';
  }
  if (!due || due === '9999') {
    return '<span class="pend" title="' + esc([...lots].join(', ')) + '">lot cut, no date</span>';
  }
  const late = due < new Date().toISOString().slice(0, 10);
  return '<span class="' + (late ? 'bal' : 'ready') + '" title="from ' + esc([...lots].join(', ')) + '">' +
    shortDate(due) + '</span>';
}

function readyCell(design, sizeLabel) {
  const r = SetTracker.lookup(design, sizeLabel);
  if (r.state === 'absent') return '<span class="pend">not on board</span>';
  if (r.state === 'done') return '<span class="ready" title="' + esc(r.label) + '">complete</span>';
  if (r.state === 'undated') {
    const t = r.missing && r.missing.length ? 'Waiting on: ' + r.missing.join(', ') : 'No dates set';
    return '<span class="pend" title="' + esc(r.label + ' — ' + t) + '">no date yet</span>';
  }
  const late = r.date < new Date().toISOString().slice(0, 10);
  return '<span class="' + (late ? 'bal' : 'ready') + '" title="' + esc(r.label) + '">' + shortDate(r.date) + '</span>';
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const title = s => String(s).replace(/\b\w/g, c => c.toUpperCase());
const msg = (html, kind) => { $('#msg').innerHTML = html ? '<div class="note' + (kind === 'bad' ? ' bad' : '') + '">' + html + '</div>' : ''; };

function readSheet(file, wanted) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('could not be read'));
    r.onload = e => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        let name = wb.SheetNames.find(n => n.toLowerCase() === wanted.toLowerCase())
          || wb.SheetNames.find(n => n.toLowerCase().includes(wanted.toLowerCase().split(' ')[0]))
          || wb.SheetNames[0];
        res({ rows: XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '', raw: false }), sheet: name });
      } catch (err) { rej(err); }
    };
    r.readAsArrayBuffer(file);
  });
}

function missingCols(rows, cols, what) {
  if (!rows.length) return 'The ' + what + ' sheet has no rows.';
  const have = Object.keys(rows[0]);
  const miss = cols.filter(c => !have.includes(c));
  return miss.length ? 'The ' + what + ' file is missing these columns: ' + miss.join(', ') : '';
}

/* ---------- persistence ---------- */
function save() {
  const ok = store.set('allot.data', { orders: S.orderRows, stock: S.stockRows, purchase: S.purchRows, track: S.track, meta: S.meta });
  if (!ok) msg('The files are loaded but too large to keep after a refresh. Everything still works this session.', 'bad');
  saveParties();
}
function saveParties() {
  const o = {};
  for (const k of Object.keys(S.names)) o[k] = { cat: S.cats[k] || '', full: !!S.fullOnly[k], name: S.names[k] };
  store.set('allot.parties', o);
  store.set('allot.src', S.src);
}
function restore() {
  const src = store.get('allot.src'); if (src) S.src = src;
  const p = store.get('allot.parties');
  if (p) for (const k of Object.keys(p)) { S.cats[k] = p[k].cat; S.fullOnly[k] = !!p[k].full; S.names[k] = p[k].name || k; }
  const d = store.get('allot.data');
  if (d) {
    if (d.orders) { S.orderRows = d.orders; S.stockRows = d.stock; }
    if (d.purchase) { S.purchRows = d.purchase; }
    if (d.track) { S.track = d.track; SetTracker.load(d.track); }
    S.meta = d.meta || S.meta;
  }
  rebuild();
}

/* ---------- pipeline ---------- */
function totalPieces(m) { let n = 0; for (const [, b] of m) for (const s of Object.keys(b)) n += b[s]; return n; }

function rebuild() {
  S.limit = { design: 120, cust: 120 };
  paintIntake();
  if (!S.orderRows) { paintEmpty(); return; }

  const d = buildDemandCore(S.orderRows, {});
  S.lines = d.lines;
  for (const ln of S.lines) {
    S.names[ln.ckey] = ln.customer;
    if (S.cats[ln.ckey] === undefined || S.cats[ln.ckey] === null) {
      const raw = (S.orderRows.find(r => custKey(r['Customer Name']) === ln.ckey) || {})['Customer Category'] || '';
      S.cats[ln.ckey] = /wholesal/i.test(raw) ? 'W1' : '';
    }
  }

  const netted = S.stockRows ? netStock(S.stockRows, { stockColumn: 'Current Stock' }).stock : new Map();
  const board = Live.on ? { sets: Live.sets, categories: Live.categories || [] } : S.track;
  Lots.build(S.purchRows, board, {});
  const split = Lots.freeStock(netted);
  S.stockMap = split.free;
  S.nettedTotal = totalPieces(netted);
  S.heldWip = split.held;

  const cats = {};
  for (const k of Object.keys(S.cats)) if (S.cats[k]) cats[k] = S.cats[k];
  const defCat = $('#defCat').value;
  const r = $('#mode').value === 'sets'
    ? allocateSets(S.lines, S.stockMap, { categories: cats, defaultCategory: defCat })
    : allocate(S.lines, S.stockMap, { categories: cats, defaultCategory: defCat });
  enforceFullOnly(S.lines, r.alloc, S.fullOnly);
  S.alloc = r.alloc;
  S.allocRows = allocationRows(S.lines, r.alloc, cats, defCat);
  S.catOf = cats; S.defCat = defCat;

  renderDesign(); renderCustomer(); renderParties();
  $('#exportBtn').disabled = false;
  checkColours();
}

function paintIntake() {
  $('#hOrders').textContent = S.orderRows ? S.orderRows.length + ' order rows · ' + (S.meta.orders || 'loaded') : 'Design Wise Order Report — tap to choose';
  $('#dropOrders').classList.toggle('on', !!S.orderRows);
  $('#hStock').textContent = S.stockRows ? S.stockRows.length + ' stock rows · ' + (S.meta.stock || 'loaded') : 'Design Wise Stock Overall Detail — tap to choose';
  $('#dropStock').classList.toggle('on', !!S.stockRows);
  $('#hPurch').textContent = S.purchRows
    ? S.purchRows.length + ' purchase rows · ' + (S.meta.purchase || 'loaded')
    : 'Purchase export — tells the app what is cut but unfinished';
  $('#dropPurch').classList.toggle('on', !!S.purchRows);
  const n = SetTracker.index ? SetTracker.index.size : 0;
  $('#hTrack').textContent = n
    ? n + ' patterns · ' + (Live.on ? 'live from the board' : (S.meta.track || 'from file'))
    : 'Reads the live board — or tap for an Export JSON';
  $('#dropTrack').classList.toggle('on', !!n);
  $('#stamp').textContent = S.meta.when ? 'Loaded ' + S.meta.when + ' · kept until you load new files' : '';
}

function paintEmpty() {
  $('#p-cust').innerHTML = '<div class="empty">Load the pending order file to see this report.</div>';
  $('#p-design').innerHTML = '<div class="empty">Load the pending order file to see this report.</div>';
}

function checkColours() {
  if (!S.stockRows) return msg('Stock file not loaded — the reports are showing, but allotted quantities will all read zero.');
  const sc = new Set([...S.stockMap.keys()].map(k => k.split('|')[1]));
  const missing = new Map();
  for (const ln of S.lines) {
    if (!S.stockMap.has(ln.design + '|' + ln.color) && !sc.has(ln.color)) missing.set(ln.color, (missing.get(ln.color) || 0) + ln.qty);
  }
  if (!missing.size) return msg('');
  const list = [...missing.entries()].sort((a, b) => b[1] - a[1]).map(([c, q]) => esc(title(c)) + ' (' + q + ')').join(', ');
  msg('<b>' + missing.size + ' colour' + (missing.size > 1 ? 's' : '') + ' in the orders have no stock rows:</b> ' + list + '. Those lines show as fully short until the spelling matches VastraApp.');
}

/* ---------- design wise, with drill-down ---------- */
function designWiseRows() {
  const map = new Map();
  for (const ln of S.lines) {
    const key = ln.design + '|' + ln.color + '|' + ln.sizeLabel;
    if (!map.has(key)) map.set(key, { key, design: ln.design, color: ln.color, size: ln.sizeLabel, qty: 0, allotted: 0, lines: [] });
    const g = map.get(key);
    g.qty += ln.qty;
    g.lines.push(ln);
  }
  for (const r of S.allocRows) {
    const g = map.get(r.design + '|' + r.color + '|' + r.size);
    if (g) g.allotted += r.allocated;
  }
  return [...map.values()].sort((a, b) =>
    a.design.localeCompare(b.design, undefined, { numeric: true })
    || a.color.localeCompare(b.color)
    || String(a.size).localeCompare(String(b.size), undefined, { numeric: true }));
}

/* short rows with nothing on the production board — the real blind spot */
function wipBanner() {
  if (!S.purchRows) {
    return '<div class="note">No purchase file loaded. Stock is being treated as fully available, which overstates it — purchase entries are made at cutting, so uncut and unstitched goods sit inside Current Stock.</div>';
  }
  if (!Lots.openLots.length) return '';
  const top = Lots.openLots.slice(0, 4)
    .map(l => esc(l.label) + ' ' + l.pieces + (l.due ? ' due ' + shortDate(l.due) : '')).join(' · ');
  return '<div class="note"><b>' + S.heldWip + ' pieces held back as work in progress</b> across ' +
    Lots.openLots.length + ' lot' + (Lots.openLots.length > 1 ? 's' : '') +
    ' still open on the board. They are counted in Current Stock but are not sets yet, so they are not allotted. ' +
    top + (Lots.openLots.length > 4 ? ' …' : '') + '</div>';
}

function boardGap(rows) {
  if (!SetTracker.index) return '';
  const gaps = rows.filter(r => r.qty > r.allotted && SetTracker.lookup(r.design, r.size).state === 'absent');
  if (!gaps.length) return '';
  const pcs = gaps.reduce((t, r) => t + (r.qty - r.allotted), 0);
  return '<div class="note"><b>' + gaps.length + ' short rows have no lot on the board</b> — ' + pcs +
    ' pieces are owed with nothing in production against them.</div>';
}

function renderDesign() {
  const rows = designWiseRows();
  let h = '<h2 class="sec">Design wise pending orders</h2>' +
    '<p class="exp">' + rows.length + ' rows · ' + rows.reduce((t, r) => t + r.qty, 0) + ' pieces pending · ' +
    rows.reduce((t, r) => t + r.allotted, 0) + ' allotted. Tap any row for the parties behind it.</p>' + wipBanner() + boardGap(rows);
  h += '<div class="tw"><table><thead><tr><th></th><th>Design</th><th>Colour</th><th>Size</th><th class="n">Pending qty</th><th class="n">Allotted</th><th class="n">Short</th></tr></thead><tbody>';
  const shown = rows.slice(0, S.limit.design);
  for (const r of shown) {
    const open = S.open.has(r.key);
    const short = r.qty - r.allotted;
    h += '<tr class="clik" data-k="' + esc(r.key) + '"><td class="tw-x">' + (open ? '&minus;' : '+') + '</td>' +
      '<td>DES-' + esc(r.design) + '</td><td>' + esc(title(r.color)) + '</td><td>' + esc(r.size) + '</td>' +
      '<td class="n">' + r.qty + '</td>' +
      '<td class="n ' + (r.allotted ? 'full' : 'none') + '">' + (r.allotted || '—') + '</td>' +
      '<td class="n ' + (short ? 'bal' : 'none') + '">' + (short || '—') + '</td></tr>';
    if (open) h += drillRows(r);
  }
  h += '</tbody></table></div>';
  if (rows.length > shown.length) {
    h += '<button class="more" id="moreDesign">Show the remaining ' + (rows.length - shown.length) + ' rows</button>';
  }
  $('#p-design').innerHTML = h;
  const md = $('#moreDesign');
  if (md) md.addEventListener('click', () => { S.limit.design += 250; renderDesign(); });
  $('#p-design').querySelectorAll('tr.clik').forEach(tr => tr.addEventListener('click', () => {
    const k = tr.dataset.k;
    S.open.has(k) ? S.open.delete(k) : S.open.add(k);
    renderDesign();
  }));
  $('#p-design').querySelectorAll('tr.clik2').forEach(tr => tr.addEventListener('click', e => {
    e.stopPropagation();
    const k = tr.dataset.k;
    S.openCust.has(k) ? S.openCust.delete(k) : S.openCust.add(k);
    renderDesign();
  }));
}

function drillRows(g) {
  const byLine = new Map(S.allocRows.map(r => [r.lineId, r]));
  const kids = g.lines.map(ln => byLine.get(ln.id)).filter(Boolean)
    .sort((a, b) => CATS.indexOf(a.category) - CATS.indexOf(b.category) || b.ordered - a.ordered);
  let h = '<tr class="sub-h"><td></td><td colspan="6">Parties ordering DES-' + esc(g.design) + ' · ' + esc(title(g.color)) + ' · ' + esc(g.size) + '</td></tr>';
  for (const k of kids) {
    const ck = g.key + '::' + k.lineId;
    const open = S.openCust.has(ck);
    h += '<tr class="sub clik2" data-k="' + esc(ck) + '"><td></td>' +
      '<td colspan="2">' + esc(k.customer) + '</td>' +
      '<td><span class="tag t-' + k.category + '">' + k.category + '</span></td>' +
      '<td class="n">' + k.ordered + '</td>' +
      '<td class="n ' + (k.allocated ? 'full' : 'none') + '">' + (k.allocated || '—') + '</td>' +
      '<td class="n ' + (k.balance ? 'bal' : 'none') + '">' + (k.balance || '—') + '</td></tr>';
    if (open) {
      h += '<tr class="detail"><td></td><td colspan="6">' +
        '<span class="dk">Order</span> ' + esc(k.order || '—') +
        ' <span class="dk">Dated</span> ' + esc(k.date || '—') +
        (k.ranges.length ? ' <span class="dk">Sizes reserved</span> ' + k.ranges.map(x => esc(x.size) + '&times;' + x.pieces).join(', ') : '') +
        (k.balance ? ' <span class="dk">Balance arrives</span> ' + arrivalCell(g.design, g.color, g.size) : ' <span class="dk">Ready to dispatch from stock</span>') +
        '</td></tr>';
    }
  }
  return h;
}

/* ---------- customer wise ---------- */
function renderCustomer() {
  const map = new Map();
  for (const ln of S.lines) {
    const key = ln.ckey + '|' + ln.design + '|' + ln.color + '|' + ln.sizeLabel;
    if (!map.has(key)) map.set(key, { customer: ln.customer, ckey: ln.ckey, design: ln.design, color: ln.color, size: ln.sizeLabel, qty: 0 });
    map.get(key).qty += ln.qty;
  }
  const rows = [...map.values()].sort((a, b) => a.customer.localeCompare(b.customer)
    || a.design.localeCompare(b.design, undefined, { numeric: true })
    || a.color.localeCompare(b.color)
    || String(a.size).localeCompare(String(b.size), undefined, { numeric: true }));

  let h = '<h2 class="sec">Customer wise pending orders</h2>' +
    '<p class="exp">' + rows.length + ' rows across ' + new Set(rows.map(r => r.ckey)).size + ' parties. ' +
    'Ready date comes from Set Tracker once the two are linked.</p>';
  h += '<div class="tw"><table><thead><tr><th>Customer</th><th>Design</th><th>Colour</th><th>Size</th><th class="n">Pending qty</th><th>Ready date</th></tr></thead><tbody>';
  const shown = rows.slice(0, S.limit.cust);
  let last = null;
  for (const r of shown) {
    if (r.customer !== last) {
      h += '<tr class="grp"><td colspan="6">' + esc(r.customer) +
        (S.cats[r.ckey] ? ' <span class="tag t-' + S.cats[r.ckey] + '">' + S.cats[r.ckey] + '</span>' : '') + '</td></tr>';
      last = r.customer;
    }
    h += '<tr><td></td><td>DES-' + esc(r.design) + '</td><td>' + esc(title(r.color)) + '</td><td>' + esc(r.size) + '</td>' +
      '<td class="n">' + r.qty + '</td><td>' + arrivalCell(r.design, r.color, r.size) + '</td></tr>';
  }
  h += '</tbody></table></div>';
  if (rows.length > shown.length) {
    h += '<button class="more" id="moreCust">Show the remaining ' + (rows.length - shown.length) + ' rows</button>';
  }
  $('#p-cust').innerHTML = h;
  const mc = $('#moreCust');
  if (mc) mc.addEventListener('click', () => { S.limit.cust += 250; renderCustomer(); });
}

/* ---------- parties drawer ---------- */
function renderParties() {
  const keys = Object.keys(S.names).sort((a, b) => S.names[a].localeCompare(S.names[b]));
  const counts = {};
  for (const ln of S.lines) counts[ln.ckey] = (counts[ln.ckey] || 0) + ln.qty;
  const unset = keys.filter(k => !S.cats[k]).length;
  $('#partyCount').textContent = keys.length ? keys.length + ' parties' + (unset ? ', ' + unset + ' unset' : '') : '';

  let h = '<p class="exp">W1 and W2 draw first. Blank parties fall to the category chosen above. ' +
    '“Whole order only” releases an allotment unless it covers the full line.</p>' +
    '<div class="bar"><label class="inline">Set all blank to <select id="bulkCat">' +
    CATS.map(c => '<option>' + c + '</option>').join('') + '</select></label>' +
    '<button id="bulkGo">Apply</button><button id="saveCats">Save list</button><button id="loadCats">Load list</button></div>' +
    '<div class="tw vscroll" style="max-height:340px;overflow:auto"><table><thead><tr><th>Party</th><th class="n">Pending</th><th>Category</th><th>Whole order only</th></tr></thead><tbody>';
  for (const k of keys) {
    h += '<tr><td>' + esc(S.names[k]) + '</td><td class="n">' + (counts[k] || 0) + '</td>' +
      '<td><select data-cat="' + esc(k) + '"><option value="">—</option>' +
      CATS.map(c => '<option' + (S.cats[k] === c ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></td>' +
      '<td><input type="checkbox" data-full="' + esc(k) + '"' + (S.fullOnly[k] ? ' checked' : '') +
      ' aria-label="Whole order only for ' + esc(S.names[k]) + '"></td></tr>';
  }
  $('#parties').innerHTML = h + '</tbody></table></div>';

  $('#parties').querySelectorAll('[data-cat]').forEach(el => el.addEventListener('change', e => {
    S.cats[e.target.dataset.cat] = e.target.value; saveParties(); rebuild();
  }));
  $('#parties').querySelectorAll('[data-full]').forEach(el => el.addEventListener('change', e => {
    S.fullOnly[e.target.dataset.full] = e.target.checked; saveParties(); rebuild();
  }));
  $('#bulkGo').addEventListener('click', () => {
    const v = $('#bulkCat').value;
    for (const k of keys) if (!S.cats[k]) S.cats[k] = v;
    saveParties(); rebuild();
  });
  $('#saveCats').addEventListener('click', () => {
    const o = {};
    for (const k of Object.keys(S.names)) o[k] = { cat: S.cats[k] || '', full: !!S.fullOnly[k], name: S.names[k] };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(o, null, 2)], { type: 'application/json' }));
    a.download = 'party-categories.json'; a.click(); URL.revokeObjectURL(a.href);
  });
  $('#loadCats').addEventListener('click', () => $('#fCats').click());
}

$('#fCats').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const o = JSON.parse(ev.target.result);
      for (const k of Object.keys(o)) { S.cats[k] = o[k].cat; S.fullOnly[k] = !!o[k].full; if (!S.names[k]) S.names[k] = o[k].name || k; }
      saveParties(); rebuild();
    } catch (err) { msg('That file is not a saved party list.', 'bad'); }
  };
  r.readAsText(f);
});

});

    '<div class="bar"><button id="saveSrc">Save and pull</button>' +
    '<span class="hintline">If the sheet is private, use File → Share → Publish to web → pick the tab → CSV, and paste that link instead.</span></div>';
  $('#saveSrc').addEventListener('click', async () => {
    S.src.orders = $('#srcOrders').value.trim();
    S.src.stock = $('#srcStock').value.trim();
    S.src.purchase = $('#srcPurch').value.trim();
    saveParties();
    await Sheets.pullAll(false);
  });
}
$('#togSources').addEventListener('click', () => {
  const d = $('#sourceWrap');
  const open = d.hasAttribute('hidden');
  open ? d.removeAttribute('hidden') : d.setAttribute('hidden', '');
  $('#togSources').setAttribute('aria-expanded', open);
  renderSources();
});
$('#refresh').addEventListener('click', () => Sheets.pullAll(false));

$('#mode').addEventListener('change', rebuild);
$('#defCat').addEventListener('change', rebuild);
$('#clear').addEventListener('click', () => {
  if (!confirm('Clear the loaded files? Party categories are kept.')) return;
  S.orderRows = S.stockRows = S.purchRows = null; S.lines = []; S.allocRows = [];
  S.track = null; SetTracker.raw = null; SetTracker.index = null;
  S.meta = { orders: '', stock: '', track: '', when: '' };
  store.set('allot.data', null);
  $('#exportBtn').disabled = true;
  msg(''); rebuild();
});

restore();
Live.start();
Sheets.pullAll(true);

</script>
</body>
</html>
